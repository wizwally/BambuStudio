# XcodeGen spec for the iPad proof-of-concept app.
# Generate the Xcode project with:  cd ios/app && xcodegen generate
name: SlicerPoC
options:
  bundleIdPrefix: com.wizwally
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    TARGETED_DEVICE_FAMILY: "2"          # iPad only (also set on the target below)
    ENABLE_USER_SCRIPT_SANDBOXING: NO    # the resource script reads ../../resources
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""                 # set your Personal Team in Xcode for device builds

targets:
  SlicerPoC:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: ../build/SlicerCore.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: Foundation.framework
      - sdk: ModelIO.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizwally.slicerpoc
        PRODUCT_NAME: SlicerPoC
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SlicerPoC-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Slicer PoC
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    postCompileScripts:
      - name: Copy Bambu profiles and test models
        basedOnDependencyAnalysis: false
        script: |
          set -e
          ROOT="${SRCROOT}/../.."
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          rm -rf "${DEST}/resources"   # never ship a top-level resources/ folder (see SlicerBridge.h)
          mkdir -p "${DEST}/BambuResources/profiles" "${DEST}/TestModels"
          rsync -a --delete "${ROOT}/resources/profiles/BBL/" "${DEST}/BambuResources/profiles/BBL/"
          cp "${ROOT}/resources/profiles/BBL.json" "${DEST}/BambuResources/profiles/BBL.json"
          [ -f "${ROOT}/ios/test/models/cube20.stl" ] || /usr/bin/python3 "${ROOT}/ios/tools/make_test_models.py"
          cp "${ROOT}/ios/test/models/"*.stl "${DEST}/TestModels/"
